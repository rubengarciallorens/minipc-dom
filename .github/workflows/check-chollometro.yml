name: Vigilar mini-PC en Chollometro

on:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "test_bot.py"
      - ".github/workflows/check-chollometro.yml"
  schedule:
    # Dos veces por hora, evitando el minuto 0 cuando Actions suele saturarse.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Enviar también un mensaje de prueba"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: chollometro-minipc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Probar filtros
        run: python3 -m unittest -v

      - name: Comprobar Chollometro
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE: "100"
          TEST_MODE: ${{ inputs.send_test || 'false' }}
        run: python3 bot.py

      - name: Guardar historial
        run: |
          if git diff --quiet -- state.json; then
            echo "El historial no ha cambiado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Actualizar historial de Chollometro"
          git push
